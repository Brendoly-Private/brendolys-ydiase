apiVersion: knowledge.ydiase/v1
kind: Domain
metadata:
  id: YD-DOM-EDU
  name: education-institutions
  title: Éducation et institutions
  status: draft
spec:
  mission: Représenter les institutions, programmes, curricula, modules, qualifications et leurs évolutions dans YDIASE.
  boundaries:
    includes:
      - institutions et campus
      - programmes et offres de programmes
      - curricula, modules et unités d'enseignement
      - qualifications, niveaux, prérequis et équivalences
    excludes:
      - profils éducatifs individuels
      - référentiel de compétences
      - orientation et recommandation
      - marché du travail
  systems:
    - YD-SYS-EDU-CATALOG
  authoritativeDocuments:
    - documentations/03-education-institutions/README.md
    - documentations/13-architecture/SERVICE_MAP.md
    - documentations/13-architecture/DATA_OWNERSHIP_MATRIX.md
    - documentations/13-architecture/MICROSERVICE_BOUNDARY_REVIEW.md