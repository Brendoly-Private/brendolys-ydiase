apiVersion: knowledge.ydiase/v1
kind: Microservice
metadata:
  id: YD-MS-LRN-001
  name: learning-discovery
  title: Learning Discovery
  status: draft
spec:
  logicalServices: [YD-SVC-LRN-001]
  authority: MIXED
  responsibility: Ressources et formations complémentaires liées aux écarts de compétences
  owns: [LearningResource, LearningOfferingRef, LearningRecommendationSet]
  consumesFrom:
    - YD-MS-EDU-003
    - YD-MS-SKL-001
  consumesEvents:
    - YD-EVT-EDU-003
    - YD-EVT-EDU-006
  invariants:
    - Un fournisseur externe reste source de ses faits externes.
    - Les recommandations learning dérivées ne réécrivent pas les sources Education ou Skills.