apiVersion: knowledge.ydiase/v1
kind: Microservice
metadata:
  id: YD-MS-REC-001
  name: recommendation
  title: Recommendation
  status: draft
spec:
  logicalServices: [YD-SVC-REC-001, YD-SVC-RSH-001]
  authority: MIXED
  responsibility: Classement, recommandations explicables et états de recommandation conservés
  owns: [RecommendationRun, RecommendationSet, RecommendationItem, RecommendationExplanation, RecommendationEvidenceSnapshot]
  consumesFrom: [YD-MS-EDU-002, YD-MS-EDU-003, YD-MS-SKL-001]
  consumesEvents: [YD-EVT-EDU-002, YD-EVT-EDU-003, YD-EVT-EDU-006]
  invariants:
    - Un résultat calculé ne devient pas source autoritative du curriculum ou des compétences.
    - RecommendationEvidenceSnapshot conserve les versions utilisées pour expliquer un résultat historique.
  documentation:
    root: documentations/13-architecture/microservices/YD-MS-REC-001/
    sources:
      - documentations/13-architecture/microservices/YD-MS-REC-001/PHASE_CLOSURE.md
      - documentations/13-architecture/microservices/YD-MS-REC-001/AUTONOMY_PROFILE.md
      - documentations/13-architecture/microservices/YD-MS-REC-001/RECOMMENDATION_RANKING_POLICY.md
      - documentations/08-orientation-recommandation/README.md
      - documentations/13-architecture/MICROSERVICE_BOUNDARY_REVIEW.md
  knowledgeMaturity: K2
  knowledgeEvidence:
    stableId: PASS
    kind: PASS
    name: PASS
    responsibilityOrPurpose: PASS
    ownerOrAuthority: {state: PASS, evidence: spec.authority + spec.owns + PHASE_CLOSURE.md}
    domainOrScope: {state: PASS, evidence: documentations/08-orientation-recommandation/README.md}
    boundaries: {state: PASS, evidence: AUTONOMY_PROFILE.md + PHASE_CLOSURE.md + MICROSERVICE_BOUNDARY_REVIEW.md}
    sourceDocuments: {state: PASS, evidence: spec.documentation.sources}
    logicalRelations: {state: PASS, evidence: education-cross-domain.relations.yaml}
    dependencies: {state: PASS, evidence: spec.consumesFrom}
    upstreamDownstream: {state: PASS, evidence: spec.consumesEvents + education-cross-domain.relations.yaml}
    authoritativeOwnership: {state: PASS, evidence: PHASE_CLOSURE.md + spec.owns}
    impactTraceability: {state: PASS, evidence: EDUCATION_SKILLS_RECOMMENDATION_IMPACT_TEST.md}
    apiOrEventContractsWhenApplicable: UNKNOWN
    dataContracts: UNKNOWN
    requirements: UNKNOWN
    adrForStructuralDecisions: UNKNOWN
