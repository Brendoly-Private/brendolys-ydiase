apiVersion: knowledge.ydiase/v1
kind: Microservice
metadata:
  id: YD-MS-KNW-001
  name: knowledge-graph
  title: Knowledge Graph
  status: draft
spec:
  logicalServices: [YD-SVC-KNW-001]
  authority: DERIVED
  responsibility: Relations sémantiques dérivées entre éducation, compétences, métiers et marché
  owns: [KnowledgeNodeProjection, KnowledgeEdge, SemanticAssertion, GraphVersion]
  consumesFrom: [YD-MS-EDU-003, YD-MS-SKL-001]
  consumesEvents: [YD-EVT-EDU-003, YD-EVT-EDU-004, YD-EVT-EDU-006]
  invariants:
    - Le graphe n'est jamais source unique d'un fait métier primaire.
    - Toute relation sémantique conserve ses références de provenance.
  documentation:
    root: documentations/13-architecture/microservices/YD-MS-KNW-001/
    sources:
      - documentations/13-architecture/microservices/YD-MS-KNW-001/PHASE_CLOSURE.md
      - documentations/13-architecture/microservices/YD-MS-KNW-001/AUTONOMY_PROFILE.md
      - documentations/13-architecture/microservices/YD-MS-KNW-001/KNOWLEDGE_GRAPH_PROJECTION_POLICY.md
      - documentations/13-architecture/MICROSERVICE_BOUNDARY_REVIEW.md
      - documentations/13-architecture/DERIVED_RECOVERY_REGISTER.md
  knowledgeMaturity: K2
  knowledgeEvidence:
    stableId: PASS
    kind: PASS
    name: PASS
    responsibilityOrPurpose: PASS
    ownerOrAuthority: {state: PASS, evidence: DERIVED + projection ownership}
    domainOrScope: {state: PASS, evidence: MICROSERVICE_BOUNDARY_REVIEW.md classe KNW-001 dans Knowledge}
    boundaries: {state: PASS, evidence: PHASE_CLOSURE.md + KNOWLEDGE_GRAPH_PROJECTION_POLICY.md}
    sourceDocuments: {state: PASS, evidence: spec.documentation.sources}
    logicalRelations: {state: PASS, evidence: education-cross-domain.relations.yaml}
    dependencies: {state: PASS, evidence: spec.consumesFrom + PHASE_CLOSURE.md}
    upstreamDownstream: {state: PASS, evidence: spec.consumesEvents + education-cross-domain.relations.yaml}
    authoritativeOwnership: {state: PASS, evidence: PHASE_CLOSURE.md confirme aucune vérité métier primaire}
    impactTraceability: {state: PASS, evidence: EDUCATION_SKILLS_RECOMMENDATION_IMPACT_TEST.md}
    apiOrEventContractsWhenApplicable: UNKNOWN
    dataContracts: UNKNOWN
    requirements: UNKNOWN
    adrForStructuralDecisions: UNKNOWN
