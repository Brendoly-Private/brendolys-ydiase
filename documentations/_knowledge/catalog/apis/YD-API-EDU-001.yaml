apiVersion: knowledge.ydiase/v1
kind: API
metadata:
  id: YD-API-EDU-001
  name: institution-validation-api
  title: Institution Validation API
  status: proposed
spec:
  owner: YD-MS-EDU-001
  consumers: [YD-MS-EDU-002]
  purpose: Valider une InstitutionRef ou CampusRef avant création ou rattachement d'une offre de programme.
  logicalMode: SYNC
  authority: YD-MS-EDU-001
  consistency: strong-on-creation
  failurePolicy: Refuser la nouvelle opération si l'institution ou le campus ne peut pas être validé.
  invariants:
    - Le consommateur ne modifie jamais Institution ou Campus.
    - Une réponse valide référence une version autoritative.
  physicalProtocol: undecided
  adrRequired: true
