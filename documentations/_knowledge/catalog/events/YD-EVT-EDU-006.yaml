apiVersion: knowledge.ydiase/v1
kind: Event
metadata:
  id: YD-EVT-EDU-006
  name: curriculum-publication-invalidated
  status: draft
spec:
  type: curriculum.publication-invalidated
  producer: YD-MS-EDU-003
  consumers: [YD-MS-EDU-002, YD-MS-SKL-001, YD-MS-KNW-001, YD-MS-REC-001, YD-MS-LRN-001]
  purpose: Propager le retrait, remplacement ou invalidation d'une version publiée sans supprimer son historique.
  payloadMinimum: [curriculum_ref, invalidated_version, reason_code, invalidated_at, replacement_ref, aggregate_version]
  semantics:
    idempotenceKey: curriculum_ref+invalidated_version+aggregate_version
    ordering: aggregate_version
    history: append-only
  invariants:
    - Une version invalidée reste historiquement traçable.
    - Elle ne reste pas sélectionnable comme version active après convergence.
    - EDU-003 reste l'autorité sur l'état de publication.