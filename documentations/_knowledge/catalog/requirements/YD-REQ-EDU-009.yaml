metadata:
  id: YD-REQ-EDU-009
  name: curriculum-publication-revocation-propagation
  status: draft
spec:
  owner: YD-MS-EDU-003
  statement: Toute version de curriculum publiée puis retirée, remplacée ou invalidée doit produire une information versionnée permettant aux consommateurs de cesser son usage actif tout en conservant la traçabilité historique.
