apiVersion: knowledge.ydiase/v1
kind: EvidenceConfidenceModel
metadata:
  id: YD-ECONF-001
  name: evidence-confidence-e0-e4
  status: draft
spec:
  principle: La confiance s'attache à une assertion ou à une preuve. Elle ne remplace jamais la maturité K d'une entité.
  levels:
    E0:
      name: UNVERIFIED
      requires: []
    E1:
      name: SOURCED
      requires: [sourceIdentified]
    E2:
      name: CORROBORATED
      requires: [sourceIdentified, authoritativeOrCorroborated]
    E3:
      name: TESTED
      requires: [sourceIdentified, reproducibleVerification]
    E4:
      name: OBSERVED
      requires: [sourceIdentified, runtimeOrOperationalObservation, observationFreshness]
  rules:
    - Le niveau calculé est continu et ne peut pas dépasser la preuve disponible.
    - E4 n'est applicable qu'aux assertions observables en exécution ou en exploitation.
    - Une assertion peut redescendre si sa source expire, si un test échoue ou si l'observation devient trop ancienne.
    - Une valeur déclarée supérieure à la valeur calculée constitue une erreur de gouvernance.
