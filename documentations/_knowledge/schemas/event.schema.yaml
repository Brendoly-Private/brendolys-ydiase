$schema: https://json-schema.org/draft/2020-12/schema
$id: knowledge.ydiase/event.schema.yaml
title: YDIASE Event
allOf:
  - $ref: ./common.schema.yaml
  - type: object
    properties:
      kind: {const: Event}
      spec:
        type: object
        required: [publisher, eventName]
        properties:
          publisher: {type: string}
          eventName: {type: string}
          version: {type: string}
          schemaRef: {type: string}
          subscribers:
            type: array
            items: {type: string}
          data:
            type: array
            items: {type: string}
          compatibility:
            enum: [backward, forward, full, none, TBD]
          retention: {type: string}
    required: [kind, spec]