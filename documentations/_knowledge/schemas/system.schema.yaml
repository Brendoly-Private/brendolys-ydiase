$schema: https://json-schema.org/draft/2020-12/schema
$id: knowledge.ydiase/system.schema.yaml
title: YDIASE System
allOf:
  - $ref: ./common.schema.yaml
  - type: object
    properties:
      kind:
        const: System
      spec:
        type: object
        required: [domain, mission]
        properties:
          domain:
            type: string
            pattern: '^YD-DOM-'
          mission:
            type: string
          capabilities:
            type: array
            items: {type: string, pattern: '^YD-CAP-'}
          components:
            type: array
            items: {type: string}
          dependencies:
            type: array
            items: {type: string, pattern: '^YD-SYS-'}
          authoritativeDocuments:
            type: array
            items: {type: string}
    required: [kind, spec]