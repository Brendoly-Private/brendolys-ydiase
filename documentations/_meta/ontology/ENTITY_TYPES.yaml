# Rôle du document
# Documente une référence de maturité, de gate ou d’ontologie utilisée pour qualifier le corpus YDIASE.
# Usage développement : référence de support pour la gouvernance et la qualification documentaire.
apiVersion: knowledge.ydiase/v1
kind: Ontology
metadata:
  id: YD-ONTOLOGY-ENTITY-TYPES
  status: draft
spec:
  entityTypes:
    organization:
      - Vision
      - Principle
      - Objective
      - Stakeholder
    business:
      - Domain
      - Subdomain
      - Concept
      - Capability
      - Feature
      - UseCase
      - Workflow
      - BusinessRule
    software:
      - System
      - LogicalService
      - Microservice
      - PlatformComponent
      - Application
      - BFF
      - Library
      - DataPipeline
      - Job
    data:
      - DataDomain
      - Aggregate
      - Entity
      - DataProduct
      - Dataset
      - Taxonomy
      - DataSource
      - Schema
    contract:
      - API
      - Event
      - Command
      - Query
      - Protocol
    intelligence:
      - Engine
      - AIModel
      - MLModel
      - Agent
      - Prompt
      - KnowledgeBase
      - Evaluation
      - Experiment
    governance:
      - Requirement
      - ADR
      - Policy
      - Standard
      - Risk
      - Hypothesis
      - Control
      - Evidence
    operations:
      - SLO
      - Runbook
      - Incident
      - BackupPolicy
      - RecoveryPlan
      - ObservabilityDefinition
    geography:
      - CountryFramework
      - Territory
      - Localization
  principles:
    - An entity has one globally stable identifier.
    - A document is a view or source attached to an entity, not the entity itself.
    - Physical deployment boundaries are distinct from business domains, capabilities and logical services.
    - Data ownership must identify one authoritative owner for each mutable aggregate.
    - Relationships use the controlled vocabulary defined by RELATION_TYPES.yaml.