$schema: https://json-schema.org/draft/2020-12/schema
$id: knowledge.ydiase/domain.schema.yaml
title: YDIASE Domain
allOf:
  - $ref: ./common.schema.yaml
  - type: object
    properties:
      kind:
        const: Domain
      spec:
        type: object
        required: [mission, boundaries]
        properties:
          mission:
            type: string
          boundaries:
            type: object
            properties:
              includes:
                type: array
                items: {type: string}
              excludes:
                type: array
                items: {type: string}
          systems:
            type: array
            items: {type: string, pattern: '^YD-SYS-'}
          capabilities:
            type: array
            items: {type: string, pattern: '^YD-CAP-'}
          authoritativeDocuments:
            type: array
            items: {type: string}
    required: [kind, spec]