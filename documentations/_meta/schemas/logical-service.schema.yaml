# Rôle du document
# Définit un schéma canonique de validation utilisé par la documentation et les contrats YDIASE.
# Usage développement : référence obligatoire pour les validations concernées.
$schema: https://json-schema.org/draft/2020-12/schema
$id: knowledge.ydiase/logical-service.schema.yaml
title: YDIASE Logical Service
allOf:
  - $ref: ./common.schema.yaml
  - type: object
    properties:
      kind:
        const: LogicalService
      spec:
        type: object
        required: [domain, responsibility]
        properties:
          domain:
            type: string
            pattern: '^YD-DOM-'
          system:
            type: string
            pattern: '^YD-SYS-'
          responsibility:
            type: string
          capabilities:
            type: array
            items: {type: string, pattern: '^YD-CAP-'}
          implementedBy:
            type: array
            items: {type: string, pattern: '^YD-(MS|PLT)-'}
          authoritativeDocuments:
            type: array
            items: {type: string}
    required: [kind, spec]