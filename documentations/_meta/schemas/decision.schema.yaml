# Rôle du document
# Définit un schéma canonique de validation utilisé par la documentation et les contrats YDIASE.
# Usage développement : référence obligatoire pour les validations concernées.
$schema: https://json-schema.org/draft/2020-12/schema
$id: knowledge.ydiase/decision.schema.yaml
title: YDIASE Architecture Decision
allOf:
  - $ref: ./common.schema.yaml
  - type: object
    properties:
      kind: {const: ADR}
      spec:
        type: object
        required: [decision]
        properties:
          context: {type: string}
          decision: {type: string, minLength: 1}
          rationale:
            type: array
            items: {type: string}
          status:
            enum: [proposed, accepted, rejected, superseded, deprecated]
          alternatives:
            type: array
            items: {type: string}
          alternativesRejected:
            type: array
            items: {type: string}
          consequences:
            type: array
            items: {type: string}
          affectedEntities:
            type: array
            items: {type: string}
          affects:
            type: array
            items: {type: string}
          supersedes: {type: string}
          supersededBy: {type: string}
          evidence:
            type: array
            items: {type: string}
    required: [kind, spec]
