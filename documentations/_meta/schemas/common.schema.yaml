$schema: https://json-schema.org/draft/2020-12/schema
$id: knowledge.ydiase/schemas/common.schema.yaml
title: YDIASE Knowledge Common Entity
type: object
required:
  - apiVersion
  - kind
  - metadata
properties:
  apiVersion:
    const: knowledge.ydiase/v1
  kind:
    type: string
    minLength: 1
  metadata:
    type: object
    required:
      - id
      - name
      - status
    properties:
      id:
        type: string
        pattern: '^YD-[A-Z0-9-]+$'
      name:
        type: string
        minLength: 1
      title:
        type: string
      status:
        enum:
          - draft
          - proposed
          - reviewed
          - approved
          - deprecated
          - superseded
          - archived
      description:
        type: string
      sourceDocuments:
        type: array
        items:
          type: string
    additionalProperties: true
  spec:
    type: object
additionalProperties: true