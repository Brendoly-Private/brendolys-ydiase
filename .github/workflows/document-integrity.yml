name: Documentation integrity audit
on:
  push:
    branches:
      - docs/integrity-correction-415
  pull_request:
    paths:
      - 'documentations/**'
      - 'scripts/audit_document_integrity.py'
      - 'scripts/fix_document_metadata.py'
      - '.github/workflows/document-integrity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Normalize metadata on correction branch
        if: github.event_name != 'pull_request'
        run: python3 scripts/fix_document_metadata.py
      - name: Audit all documentation
        run: python3 scripts/audit_document_integrity.py
      - name: Commit metadata corrections
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- documentations; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add documentations
            git commit -m "docs: normalize missing document metadata"
            git push
          fi
